[project]
name = "wagenow-api"
version = "1.0.0"
description = "WageNow Ghana — Earned Wage Access API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.3",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
    "cryptography>=43.0",
    "bcrypt>=4.0",
    "pyotp>=2.9",
    "structlog>=24.0",
    "openpyxl>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
omit = ["src/services/workers/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
