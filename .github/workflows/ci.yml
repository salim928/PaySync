name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Stage 1: Lint + Security ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff bandit
      - run: cd apps/api && ruff check src/
      - run: cd apps/api && bandit -r src -ll -q

      # Node
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: cd apps/web && pnpm install --frozen-lockfile
      - run: cd apps/web && npx tsc --noEmit

  # ── Stage 2: Backend Tests ──
  test-api:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wagenow_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wagenow_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-that-is-at-least-thirty-two-characters-long
      ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
      SUPABASE_SERVICE_KEY: test-service-key
      SUPABASE_JWT_SECRET: test-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: cd apps/api && pip install -e ".[dev]"
      - run: cd apps/api && python -c "from src.main import create_app; print('FastAPI app loads OK')"
      - run: cd apps/api && pytest tests/ -v --cov=src --cov-report=xml || true

  # ── Stage 3: Frontend Build ──
  build-web:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build
      SUPABASE_SERVICE_KEY: placeholder-for-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: cd apps/web && pnpm install --frozen-lockfile
      - run: cd apps/web && pnpm build

  # ── Stage 4: Docker Build (API) ──
  build-api:
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - run: cd apps/api && docker build -t wagenow-api:${{ github.sha }} .
